<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow" />
<title>dev console</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'JetBrains Mono', 'Fira Code', monospace;
    background: #0f1117; color: #e2e8f0;
    display: flex; min-height: 100vh;
  }

  /* ── Left service rail ─────────────────────────────────────────────── */
  .rail {
    width: 200px; flex: 0 0 200px; background: #0b0d13;
    border-right: 1px solid #1e2433; padding: 24px 0;
    display: flex; flex-direction: column; gap: 2px;
    position: sticky; top: 0; height: 100vh; overflow-y: auto;
  }
  .rail h1 { font-size: 0.8rem; color: #475569; padding: 0 20px 20px; letter-spacing: 0.05em; }
  .svc-btn {
    background: none; border: none; border-left: 2px solid transparent;
    color: #64748b; padding: 10px 20px; font-family: inherit; font-size: 0.8rem;
    text-align: left; cursor: pointer; display: flex; align-items: center; gap: 8px;
    text-transform: lowercase; letter-spacing: 0.03em;
  }
  .svc-btn:hover { color: #cbd5e1; background: #12151f; }
  .svc-btn.active { color: #e2e8f0; background: #12151f; }
  .svc-btn .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 8px; }
  .svc-btn.active { border-left-color: currentColor; }

  /* ── Main panel ─────────────────────────────────────────────────────── */
  .main { flex: 1; padding: 32px 40px; overflow-y: auto; max-width: 1100px; }
  .panel { display: none; }
  .panel.active { display: block; }

  .svc-head { margin-bottom: 8px; }
  .svc-head .name { font-size: 1.2rem; font-weight: 600; }
  .svc-head .desc { font-size: 0.75rem; color: #64748b; margin-top: 4px; }
  .base-row { display: flex; align-items: center; gap: 8px; margin: 16px 0 28px; flex-wrap: wrap; }
  .base-row .label { font-size: 0.7rem; color: #475569; text-transform: uppercase; letter-spacing: 0.08em; }
  .base-row input { width: 420px; }
  .same-origin { font-size: 0.7rem; color: #475569; }

  /* ── Endpoint card ─────────────────────────────────────────────────── */
  .ep {
    background: #12151f; border: 1px solid #1e2433; border-radius: 10px;
    padding: 16px 18px; margin-bottom: 14px;
  }
  .ep.islist { border-color: #1f3a2a; }
  .ep-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .m { font-size: 0.65rem; font-weight: 700; padding: 3px 8px; border-radius: 5px; letter-spacing: 0.05em; }
  .m.GET    { background: #14331f; color: #4ade80; }
  .m.POST   { background: #142033; color: #60a5fa; }
  .m.DELETE { background: #331414; color: #f87171; }
  .m.PATCH, .m.PUT { background: #33280f; color: #fbbf24; }
  .path { font-size: 0.85rem; color: #e2e8f0; }
  .listtag { font-size: 0.6rem; color: #4ade80; border: 1px solid #1f5133; border-radius: 4px; padding: 1px 6px; text-transform: uppercase; letter-spacing: 0.08em; }
  .ep-head .spacer { flex: 1; }
  .ep-desc { font-size: 0.72rem; color: #64748b; margin: 8px 0 0; }

  .params { display: flex; flex-wrap: wrap; gap: 10px 14px; margin-top: 12px; align-items: flex-end; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field .flabel { font-size: 0.65rem; color: #475569; }
  .field .flabel .in { color: #334155; text-transform: uppercase; letter-spacing: 0.06em; margin-left: 4px; }
  .field.body { flex: 1 1 100%; }

  input, select, textarea {
    background: #0f1117; border: 1px solid #2d3748; border-radius: 6px; color: #e2e8f0;
    padding: 7px 10px; font-family: inherit; font-size: 0.8rem;
  }
  input { width: 150px; }
  input.wide { width: 320px; }
  input.narrow { width: 80px; }
  textarea { width: 100%; resize: vertical; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: #2563eb; }

  button.send { background: #1e3a5f; border: 1px solid #2563eb; border-radius: 6px; color: #93c5fd; padding: 6px 16px; font-family: inherit; font-size: 0.78rem; cursor: pointer; }
  button.send:hover { background: #1e4a8f; }
  button.send.del { background: #3b1a1a; border-color: #dc2626; color: #f87171; }
  button.send.del:hover { background: #5a1a1a; }
  button.ghost { background: none; border: 1px solid #2d3748; border-radius: 6px; color: #475569; padding: 6px 12px; font-family: inherit; font-size: 0.78rem; cursor: pointer; }
  button.ghost:hover { background: #1e2433; color: #94a3b8; }

  .output {
    background: #0b0d13; border: 1px solid #1e2433; border-radius: 8px;
    padding: 12px 14px; font-size: 0.75rem; color: #94a3b8; margin-top: 12px;
    white-space: pre-wrap; word-break: break-all; max-height: 420px; overflow: auto;
    display: none;
  }
  .output.show { display: block; }
  .output.ok  { color: #34d399; }
  .output.err { color: #f87171; }
  .meta { font-size: 0.65rem; color: #475569; margin-bottom: 6px; }
</style>
</head>
<body>

<nav class="rail" id="rail"><h1>// dev console</h1></nav>
<main class="main" id="main"></main>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   Declarative endpoint catalog. One entry per SERVICE; endpoints render as
   testable cards. List/GET endpoints are surfaced first (list:true → badge).

   param `in`: 'query' | 'header' | 'path' | 'body'
   Same-origin services (base '') go through the frontend's Caddy proxy — this
   page only works fully when served from v2x.tools (or wherever Caddy runs).
   ══════════════════════════════════════════════════════════════════════════ */
const REPO_URL = 'https://v2x-tools-repo-production.up.railway.app';

const SERVICES = [
  /* ── ENGINE ──────────────────────────────────────────────────────────── */
  {
    id: 'engine', name: 'engine', color: '#f59e0b', base: '',
    desc: 'codecs · content-addressed · HTTP-only. Only the read-only list is exposed publicly (Caddy); load/convert/generate live in the hub tab.',
    endpoints: [
      { method:'GET', path:'/engine/loaded', list:true,
        desc:'List loaded engines — engineId → metadata for every codec currently held in memory.' },
    ],
  },

  /* ── REPO ────────────────────────────────────────────────────────────── */
  {
    id: 'repo', name: 'repo', color: '#22c55e', base: REPO_URL,
    desc: 'ASN.1 module authority. Digests raw ASN.1 → digested tree. Postgres-backed.',
    endpoints: [
      { method:'GET', path:'/api/modules', list:true, desc:'List all modules.' },
      { method:'GET', path:'/api/modules/public', list:true, desc:'List public modules (userId 0).' },
      { method:'GET', path:'/api/modules/by-user', list:true, desc:'List modules owned by a user.',
        params:[{name:'userId', in:'query', def:'0', cls:'narrow'}] },
      { method:'GET', path:'/api/index/search', list:true, desc:'Search the type index across modules.',
        params:[{name:'q', in:'query'},{name:'asn1Type', in:'query'},{name:'moduleId', in:'query'}] },
      { method:'GET', path:'/api/index/elements', list:true, desc:'All indexed elements of one module.',
        params:[{name:'moduleId', in:'query', cls:'wide'}] },
      { method:'GET', path:'/api/modules/by-oid', desc:'Find a module by its ASN.1 OID.',
        params:[{name:'oid', in:'query', cls:'wide', ph:'CAM_PDU_Descriptions {itu-t(0) ...}'}] },
      { method:'GET', path:'/api/modules/{id}', desc:'Find a module by numeric id.',
        params:[{name:'id', in:'path', cls:'narrow'}] },
      { method:'GET', path:'/api/modules/tree', desc:'Digested tree (what the engine loads).',
        params:[{name:'moduleId', in:'query', cls:'wide'},{name:'type', in:'query'},{name:'format', in:'query', def:'json'}] },
      { method:'GET', path:'/api/modules/elements', desc:'Types/elements of a module (a.k.a. /types).',
        params:[{name:'moduleId', in:'query', cls:'wide'}] },
      { method:'GET', path:'/api/modules/structure', desc:'Digested AST structure (server-side parse, no source).',
        params:[{name:'moduleId', in:'query', cls:'wide'}] },
      { method:'POST', path:'/api/modules/validate', desc:'Validate ASN.1 without saving (4 layers).',
        params:[{name:'body', in:'body', ct:'text/plain', rows:8, ph:'Paste ASN.1 content...'}] },
      { method:'POST', path:'/api/modules/upload', desc:'Upload one or more modules.',
        params:[{name:'userId', in:'query', def:'0', cls:'narrow'},{name:'body', in:'body', ct:'text/plain', rows:8, ph:'Paste ASN.1 content...'}] },
      { method:'DELETE', path:'/api/modules/by-oid', desc:'Delete a module by OID.',
        params:[{name:'oid', in:'query', cls:'wide'}] },
      { method:'DELETE', path:'/api/modules/{id}', desc:'Delete a module by numeric id.',
        params:[{name:'id', in:'path', cls:'narrow'}] },
    ],
  },

  /* ── HUB ─────────────────────────────────────────────────────────────── */
  {
    id: 'hub', name: 'hub', color: '#3b82f6', base: '',
    desc: 'Public façade the frontend uses. Resolves X-Ref → engineId, orchestrates repo + engine. Owns aliases + saved messages.',
    endpoints: [
      { method:'GET', path:'/api/modules', list:true, desc:'Modules joined with the alias table.',
        params:[{name:'X-User-Id', in:'header', def:'0', cls:'narrow'},{name:'sort', in:'query', def:'name', ph:'name | uploaded'}] },
      { method:'GET', path:'/api/aliases', list:true, desc:'Module aliases for a user (0 = public).',
        params:[{name:'X-User-Id', in:'header', def:'0', cls:'narrow'}] },
      { method:'GET', path:'/api/messages', list:true, desc:'Saved messages (named refs) for a user.',
        params:[{name:'X-User-Id', in:'header', def:'0', cls:'narrow'}] },
      { method:'GET', path:'/api/index/elements', list:true, desc:'Indexed elements of a module (via repo).',
        params:[{name:'moduleId', in:'query', cls:'wide'}] },
      { method:'GET', path:'/api/modules/types', desc:'Types of a module (by OID header).',
        params:[{name:'X-Module-Oid', in:'header', cls:'wide'}] },
      { method:'GET', path:'/api/modules/structure', desc:'Digested AST structure (by OID header).',
        params:[{name:'X-Module-Oid', in:'header', cls:'wide'}] },
      { method:'POST', path:'/api/resolve', desc:'Resolve an X-Ref → (moduleId, type, fixups, engineId).',
        params:[{name:'X-User-Id', in:'header', def:'0', cls:'narrow'},{name:'X-Ref', in:'header', def:'_cam_v2'}] },
      { method:'POST', path:'/api/generate', desc:'Generate a sample message for a ref.',
        params:[{name:'X-Ref', in:'header', def:'_cam_v2'},{name:'X-User-Id', in:'header', def:'0', cls:'narrow'},
                {name:'body', in:'body', ct:'application/json', rows:3, ph:'{"format":"UPER","size":"SMALL","minimal":false}'}] },
      { method:'POST', path:'/api/convert', desc:'Convert a payload. Leave X-Ref blank to auto-detect from the ITS header.',
        params:[{name:'X-Ref', in:'header', ph:'(blank → auto-detect)'},{name:'X-From', in:'header', def:'UPER'},
                {name:'X-To', in:'header', def:'JER'},{name:'X-User-Id', in:'header', def:'0', cls:'narrow'},
                {name:'body', in:'body', ct:'text/plain', rows:5, ph:'payload (uper:hex / wer:hex / JSON / XML)'}] },
      { method:'POST', path:'/api/aliases', desc:'Create an alias → module OID.',
        params:[{name:'X-User-Id', in:'header', def:'0', cls:'narrow'},{name:'X-Alias', in:'header', ph:'_cam_v2'},
                {name:'X-Module-Oid', in:'header', cls:'wide'}] },
      { method:'DELETE', path:'/api/aliases', desc:'Delete an alias.',
        params:[{name:'X-User-Id', in:'header', def:'0', cls:'narrow'},{name:'X-Alias', in:'header', ph:'_cam_v2'}] },
      { method:'POST', path:'/api/messages', desc:'Create a saved message (ref bound to alias:rootType + fixups).',
        params:[{name:'X-User-Id', in:'header', def:'0', cls:'narrow'},
                {name:'body', in:'body', ct:'application/json', rows:5,
                 ph:'{"name":"_cam_v2","moduleAlias":"_cam_v2","rootType":"CAM","description":"","fixups":[]}'}] },
      { method:'DELETE', path:'/api/messages', desc:'Delete a saved message by name.',
        params:[{name:'X-User-Id', in:'header', def:'0', cls:'narrow'},{name:'X-Message-Name', in:'header', ph:'_cam_v2'}] },
      { method:'POST', path:'/api/cache/clear', desc:'Clear the ref→engineId cache for a user.',
        params:[{name:'userId', in:'query', def:'0', cls:'narrow'}] },
      { method:'POST', path:'/api/cache/clear-all', desc:'Clear the whole resolution cache.' },
    ],
  },

  /* ── USERS ───────────────────────────────────────────────────────────── */
  {
    id: 'users', name: 'users', color: '#a855f7', base: '', auth: 'bearer',
    desc: 'Identity / SSO. Google OAuth + RS256 JWT (JWKS). Admin endpoints need a Bearer token below.',
    endpoints: [
      { method:'GET', path:'/api/auth/admin/users', list:true, auth:true, desc:'List all users (admin).' },
      { method:'GET', path:'/api/auth/admin/organizations', list:true, auth:true, desc:'List organizations (admin).' },
      { method:'GET', path:'/api/auth/admin/invites', list:true, auth:true, desc:'List invite codes (admin).' },
      { method:'GET', path:'/api/auth/me', auth:true, desc:'The current user for the Bearer token.' },
      { method:'GET', path:'/api/auth/.well-known/jwks.json', list:true, desc:'Public JWKS (verify JWTs).' },
      { method:'GET', path:'/api/auth/{provider}/login', link:true, desc:'Open the OAuth login dance (top-level redirect).',
        params:[{name:'provider', in:'path', def:'google', cls:'narrow'}] },
    ],
  },

  /* ── BACKEND (legacy) ────────────────────────────────────────────────── */
  {
    id: 'backend', name: 'backend', color: '#64748b', base: '',
    desc: 'Legacy, no DB. Only non-V2X cruft: contact form, stats, monitoring. No list endpoints.',
    endpoints: [
      { method:'POST', path:'/api/contact', desc:'Contact form → Telegram.',
        params:[{name:'body', in:'body', ct:'application/json', rows:4, ph:'{"name":"","email":"","message":""}'}] },
      { method:'POST', path:'/api/monitoring/test', desc:'Fire a test monitoring/Telegram ping.' },
    ],
  },
];

/* ── Render ────────────────────────────────────────────────────────────── */
const rail = document.getElementById('rail');
const main = document.getElementById('main');
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

SERVICES.forEach((s, si) => {
  // sort: list endpoints first, keep declared order otherwise
  s.endpoints = s.endpoints.map((e, i) => ({ ...e, _i: i }))
    .sort((a, b) => (b.list?1:0) - (a.list?1:0) || a._i - b._i);

  const btn = document.createElement('button');
  btn.className = 'svc-btn' + (si === 0 ? ' active' : '');
  btn.innerHTML = `<span class="dot" style="background:${s.color}"></span>${esc(s.name)}`;
  btn.onclick = () => selectService(si);
  rail.appendChild(btn);

  const panel = document.createElement('section');
  panel.className = 'panel' + (si === 0 ? ' active' : '');
  panel.id = 'panel-' + s.id;

  const sameOrigin = s.base === '';
  panel.innerHTML = `
    <div class="svc-head">
      <div class="name" style="color:${s.color}">${esc(s.name)}</div>
      <div class="desc">${esc(s.desc)}</div>
    </div>
    <div class="base-row">
      <span class="label">base</span>
      ${sameOrigin
        ? `<input id="base-${si}" type="text" value="" placeholder="(same-origin)"><span class="same-origin">same-origin → Caddy proxies to ${esc(s.id)}</span>`
        : `<input id="base-${si}" type="text" value="${esc(s.base)}">`}
      ${s.auth === 'bearer' ? `<span class="label" style="margin-left:16px">bearer</span><input id="token-${si}" class="wide" type="text" placeholder="paste JWT (auto-sent as Authorization)">` : ''}
    </div>
    <div id="eps-${si}"></div>`;
  main.appendChild(panel);

  const epsBox = panel.querySelector('#eps-' + si);
  s.endpoints.forEach((ep, ei) => epsBox.appendChild(renderEndpoint(s, si, ep, ei)));
});

function renderEndpoint(s, si, ep, ei) {
  const card = document.createElement('div');
  card.className = 'ep' + (ep.list ? ' islist' : '');
  const params = ep.params || [];
  const fields = params.map((p, pi) => {
    const id = `in-${si}-${ei}-${pi}`;
    const cls = p.in === 'body' ? '' : (p.cls || '');
    const val = p.def != null ? esc(p.def) : '';
    const ph = p.ph ? esc(p.ph) : '';
    if (p.in === 'body') {
      return `<div class="field body">
        <span class="flabel">body <span class="in">${esc(p.ct || 'application/json')}</span></span>
        <textarea id="${id}" rows="${p.rows || 4}" placeholder="${ph}"></textarea>
      </div>`;
    }
    return `<div class="field">
      <span class="flabel">${esc(p.name)} <span class="in">${p.in}</span></span>
      <input id="${id}" class="${cls}" type="text" value="${val}" placeholder="${ph}">
    </div>`;
  }).join('');

  const action = ep.link
    ? `<button class="send" onclick="openLink(${si},${ei})">open ↗</button>`
    : `<button class="send${ep.method === 'DELETE' ? ' del' : ''}" onclick="send(${si},${ei})">send</button>`;

  card.innerHTML = `
    <div class="ep-head">
      <span class="m ${ep.method}">${ep.method}</span>
      <span class="path">${esc(ep.path)}</span>
      ${ep.list ? '<span class="listtag">list</span>' : ''}
      <span class="spacer"></span>
      ${action}
      <button class="ghost" onclick="clr(${si},${ei})">clear</button>
    </div>
    ${ep.desc ? `<div class="ep-desc">${esc(ep.desc)}</div>` : ''}
    ${params.length ? `<div class="params">${fields}</div>` : ''}
    <div class="output" id="out-${si}-${ei}"></div>`;
  return card;
}

/* ── Behaviour ─────────────────────────────────────────────────────────── */
function selectService(si) {
  document.querySelectorAll('.svc-btn').forEach((b, i) => b.classList.toggle('active', i === si));
  document.querySelectorAll('.panel').forEach((p, i) => p.classList.toggle('active', i === si));
}

function baseFor(si) { return document.getElementById('base-' + si).value.trim(); }
function val(id) { const el = document.getElementById(id); return el ? el.value : ''; }

function buildRequest(si, ei) {
  const s = SERVICES[si], ep = s.endpoints[ei];
  let path = ep.path;
  const query = [], headers = {};
  let body = null, ct = null;
  (ep.params || []).forEach((p, pi) => {
    const v = val(`in-${si}-${ei}-${pi}`);
    if (p.in === 'path') path = path.replace(`{${p.name}}`, encodeURIComponent(v));
    else if (p.in === 'query') { if (v !== '') query.push(`${p.name}=${encodeURIComponent(v)}`); }
    else if (p.in === 'header') { if (v !== '') headers[p.name] = v; }
    else if (p.in === 'body') { if (v !== '') { body = v; ct = p.ct || 'application/json'; } }
  });
  if (ep.auth && s.auth === 'bearer') {
    const tok = val('token-' + si).trim();
    if (tok) headers['Authorization'] = tok.startsWith('Bearer ') ? tok : 'Bearer ' + tok;
  }
  const url = baseFor(si) + path + (query.length ? '?' + query.join('&') : '');
  return { method: ep.method, url, body, ct, headers };
}

async function send(si, ei) {
  const { method, url, body, ct, headers } = buildRequest(si, ei);
  const out = document.getElementById(`out-${si}-${ei}`);
  out.className = 'output show';
  out.textContent = `→ ${method} ${url}\nloading...`;
  const t0 = performance.now();
  try {
    const opts = { method, headers: { ...headers } };
    if (body != null) { opts.body = body; opts.headers['Content-Type'] = ct; }
    const res = await fetch(url, opts);
    const text = await res.text();
    const ms = Math.round(performance.now() - t0);
    let pretty = text || '(empty)';
    try { pretty = JSON.stringify(JSON.parse(text), null, 2); } catch {}
    out.className = 'output show ' + (res.ok ? 'ok' : 'err');
    out.innerHTML = `<div class="meta">${method} ${esc(url)} → ${res.status} · ${ms}ms</div>`;
    out.append(document.createTextNode(pretty));
  } catch (e) {
    out.className = 'output show err';
    out.innerHTML = `<div class="meta">${method} ${esc(url)} → failed</div>`;
    out.append(document.createTextNode(e.message + '\n(cross-origin? this service may only be reachable same-origin via Caddy)'));
  }
}

function openLink(si, ei) {
  const { url } = buildRequest(si, ei);
  window.open(url, '_blank');
}

function clr(si, ei) {
  const out = document.getElementById(`out-${si}-${ei}`);
  out.className = 'output';
  out.textContent = '';
}
</script>
</body>
</html>
